name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (embed assets)
        working-directory: frontend
        run: npm run build

      - name: Cache mihomo core
        uses: actions/cache@v4
        with:
          path: resources/core
          key: mihomo-windows-amd64-${{ hashFiles('scripts/download-mihomo.ps1') }}
          restore-keys: |
            mihomo-windows-amd64-

      - name: Download mihomo (for embed)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path 'resources\core\mihomo.exe') -or -not (Test-Path 'resources\core\geoip.metadb')) {
            .\scripts\download-mihomo.ps1
          }

      - name: Run tests
        run: go test ./tests/... -count=1 -timeout 5m

      - name: Verify app compiles
        run: |
          New-Item -ItemType Directory -Force -Path build\bin | Out-Null
          go build -tags "desktop,production" -ldflags "-w -s -H windowsgui" -o build\bin\MyInternetVPN.exe .
        shell: pwsh

  package:
    name: Package (main)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache mihomo core
        uses: actions/cache@v4
        with:
          path: resources/core
          key: mihomo-windows-amd64-${{ hashFiles('scripts/download-mihomo.ps1') }}
          restore-keys: |
            mihomo-windows-amd64-

      - name: Build signed package
        shell: pwsh
        env:
          APP_VERSION: ${{ github.sha }}
          PACKAGE_ASSET_NAME: MyInternetVPN-windows-amd64
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path 'resources\core\mihomo.exe')) {
            Write-Host 'mihomo cache miss — downloading'
          }
          .\scripts\package.ps1


      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyInternetVPN-windows-amd64
          path: |
            dist/package/*.zip
            dist/package/*.sha256
            dist/package/*.sig
            dist/package/*.version
          if-no-files-found: error
          retention-days: 30

      - name: Prune old rolling-release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $keep = @(
            'MyInternetVPN-windows-amd64.zip',
            'MyInternetVPN-windows-amd64.zip.sha256',
            'MyInternetVPN-windows-amd64.zip.sig',
            'MyInternetVPN-windows-amd64.zip.version'
          )
          $assets = gh release view latest-main --json assets -q ".assets[].name" 2>$null
          if (-not $assets) { Write-Host 'No existing latest-main release'; return }
          foreach ($name in ($assets -split "`n")) {
            $name = $name.Trim()
            if (-not $name) { continue }
            if ($keep -contains $name) { continue }
            Write-Host "Deleting stale asset: $name"
            gh release delete-asset latest-main $name --yes
          }

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-main
          name: Latest main build
          body: |
            Rolling signed build from `main`.

            - **Build:** `${{ github.sha }}`
            - **Assets:** `MyInternetVPN-windows-amd64.zip` + `.sha256` + `.sig` + `.version`
          files: |
            dist/package/MyInternetVPN-windows-amd64.zip
            dist/package/MyInternetVPN-windows-amd64.zip.sha256
            dist/package/MyInternetVPN-windows-amd64.zip.sig
            dist/package/MyInternetVPN-windows-amd64.zip.version
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
